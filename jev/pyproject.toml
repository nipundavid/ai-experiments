[project]
name = "jev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nipun David", email = "nipun18david@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.24.0",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.11",
]

[project.scripts]
jev = "jev:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
